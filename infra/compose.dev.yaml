# Lokale Entwicklungsumgebung: PostgreSQL + Keycloak mit Realm "judo" und Testnutzern.
#
#   podman compose -f infra/compose.dev.yaml up -d     (oder: docker compose …)
#
# Alle Passwörter sind reine Dev-Defaults und lassen sich per Umgebungsvariable überschreiben.
# Details: infra/README.md

name: judo-portal-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-portal}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      # Ab PostgreSQL 18 wird /var/lib/postgresql gemountet (nicht mehr .../data).
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      # Über TCP prüfen: Während der Init-Phase lauscht Postgres nur auf dem Unix-Socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-judo-dev.json:/opt/keycloak/data/import/realm-judo-dev.json:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Das Image enthält weder curl noch grep, daher ein reiner Bash-HTTP-Request auf den Management-Port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          while read -r line <&3; do [[ $$line == *'"UP"'* ]] && exit 0; done; exit 1
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:

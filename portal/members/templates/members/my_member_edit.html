{% extends "base.html" %}
{% block title %}{{ member.display_name }} bearbeiten{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <a href="{% url 'my_member' member.pk %}" class="link link-hover mb-3 inline-flex items-center gap-1 text-sm"><i class="bi bi-arrow-left" aria-hidden="true"></i> {{ member.display_name }}</a>
  <div class="card bg-base-100 shadow-sm"><div class="card-body gap-4">
    <h1 class="text-2xl font-bold">{{ member.display_name }} bearbeiten</h1>
    <form method="post" class="flex flex-col gap-4">{% csrf_token %}
      {{ form }}
      <div class="flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Speichern</button><a class="btn" href="{% url 'my_member' member.pk %}">Abbrechen</a></div>
    </form>
  </div></div>
</div>
{% endblock %}

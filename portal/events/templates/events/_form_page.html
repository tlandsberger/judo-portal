{% extends "base.html" %}
{% block title %}{% block heading %}{% endblock %}{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <a href="{% block back_url %}{% endblock %}" class="link link-hover mb-3 inline-flex items-center gap-1 text-sm"><i class="bi bi-arrow-left" aria-hidden="true"></i> {% block back_label %}{% endblock %}</a>
  <div class="card bg-base-100 shadow-sm"><div class="card-body gap-4">
    <h1 class="text-2xl font-bold">{% block heading2 %}{% endblock %}</h1>
    {% block intro %}{% endblock %}
    <form method="post" class="flex flex-col gap-4">{% csrf_token %}
      {{ form }}
      <div class="flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Speichern</button><a class="btn" href="{% block cancel_url %}{% endblock %}">Abbrechen</a></div>
    </form>
  </div></div>
</div>
{% endblock %}

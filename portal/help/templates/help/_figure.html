{% load static %}
<figure class="my-5">
  {% for theme, suffix in themes %}
  <picture class="help-shot-{{ theme }}">
    {% if mobile %}<source media="(max-width: 640px)" srcset="{% static 'help/img/'|add:name|add:'-handy'|add:suffix|add:'.jpg' %}">{% endif %}
    <img class="mx-auto w-full max-w-72 rounded-box border border-base-300 shadow-sm sm:max-w-full" src="{% static 'help/img/'|add:name|add:'-desktop'|add:suffix|add:'.jpg' %}" alt="{{ alt }}" loading="lazy">
  </picture>
  {% endfor %}
  {% if caption %}<figcaption class="mt-2 text-sm text-base-content/70">{{ caption }}</figcaption>{% endif %}
</figure>

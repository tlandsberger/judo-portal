{% if messages %}
<div class="mb-6 flex flex-col gap-2" role="status">
  {% for message in messages %}
  <div class="alert alert-soft {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
    <i class="bi {% if message.tags == 'error' %}bi-exclamation-triangle{% else %}bi-check-circle{% endif %} text-lg" aria-hidden="true"></i>
    <span>{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}

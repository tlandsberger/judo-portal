{# Fußzeile als DaisyUI-Footer: am Handy untereinander, ab sm nebeneinander. Links als <div> statt <aside>, weil ein aside im Footer ein eigener Landmark wäre. #}
<footer class="footer sm:footer-horizontal gap-y-2 mx-auto max-w-5xl items-center px-4 py-6 lg:px-8 {% if on_dark %}text-neutral-content/80{% else %}text-base-content/70{% endif %}">
  <div><p>{{ club_name }}</p></div>
  <nav class="grid-flow-col gap-x-4 sm:justify-self-end" aria-label="Kontakt und Version">
    <a class="link link-hover" href="mailto:{{ club_email }}">{{ club_email }}</a>
    <a class="link link-hover" href="{{ club_website }}" rel="noopener">Website</a>
    <a class="link link-hover" href="{{ portal_version_url }}" rel="noopener" title="Was ist neu?">Version {{ portal_version }}</a>
  </nav>
</footer>

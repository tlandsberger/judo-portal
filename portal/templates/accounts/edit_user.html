{% extends "base.html" %}
{% block title %}Rollen bearbeiten{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <a href="{% url 'user_list' %}" class="link link-hover mb-3 inline-flex items-center gap-1 text-sm"><i class="bi bi-arrow-left" aria-hidden="true"></i> Benutzer</a>
  <div class="card bg-base-100 shadow-sm"><div class="card-body gap-4">
    <div>
      <h1 class="text-2xl font-bold">{{ target_user.display_name }}</h1>
      <p class="text-base-content/70">{{ target_user.email }}</p>
    </div>
    <form method="post" class="flex flex-col gap-4">{% csrf_token %}
      {{ form }}
      <div class="flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Speichern</button><a class="btn" href="{% url 'user_list' %}">Abbrechen</a></div>
    </form>
  </div></div>
</div>
{% endblock %}

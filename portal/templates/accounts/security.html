{% extends "base.html" %}
{% block title %}Meine Anmeldung{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
  <h1 class="text-3xl font-bold">Meine Anmeldung</h1>
  <p class="mt-1 mb-6 text-base-content/70">Angemeldet als <strong>{{ user.email }}</strong>.</p>
  {% include "accounts/_login_methods.html" %}
  <ul class="list rounded-box bg-base-100 shadow-sm">
    <li>
      <a class="list-row items-center hover:bg-base-200" href="{% url 'usersessions_list' %}">
        <i class="bi bi-laptop text-3xl text-primary" aria-hidden="true"></i>
        <div class="list-col-grow"><h2 class="font-semibold">Angemeldete Geräte</h2><p class="text-sm text-base-content/70">Wo du gerade angemeldet bist – andere Geräte abmelden.</p></div>
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </a>
    </li>
  </ul>
</div>
{% endblock %}

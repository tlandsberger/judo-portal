# Changelog und Versionierung aus Conventional Commits (git-cliff), genutzt vom Release-Workflow.
# fix → Patch, feat → Minor, Breaking Change (! oder BREAKING CHANGE) → Major.

[changelog]
header = ""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%d.%m.%Y") }}){% else %}## Unveröffentlicht{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**Breaking Change**){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Neue Funktionen" },
  { message = "^fix\\(deps\\)", group = "<!-- 3 -->Abhängigkeiten" },
  { message = "^fix", group = "<!-- 1 -->Fehlerbehebungen" },
  { message = "^perf", group = "<!-- 2 -->Leistung" },
  { message = "^chore\\(deps\\)", group = "<!-- 3 -->Abhängigkeiten" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(refactor|style)", group = "<!-- 4 -->Überarbeitungen" },
  { message = "^docs", group = "<!-- 5 -->Dokumentation" },
  { message = "^(test|ci|build|chore)", group = "<!-- 6 -->Technik" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"

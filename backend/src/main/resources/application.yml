spring:
  application:
    name: judo-portal
  threads:
    virtual:
      enabled: true

  # Lokale Defaults passen zu infra/compose.dev.yaml, in anderen Umgebungen per Umgebungsvariable setzen.
  datasource:
    url: ${PORTAL_DB_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${PORTAL_DB_USER:portal}
    password: ${PORTAL_DB_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PORTAL_ISSUER_URI:http://localhost:8081/realms/judo}
          # Nur Tokens, die ausdrücklich für die Portal-API ausgestellt wurden (ADR 0006).
          audiences: judo-portal-api

  mvc:
    problemdetails:
      enabled: true
  # Uploads (CSV-Import der Mitgliederliste) bleiben klein und werden nur im Speicher verarbeitet.
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

springdoc:
  # Nur die Portal-API beschreiben (kein Actuator), stabil sortiert für den Vertrag api/openapi.json.
  paths-to-match: /api/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health

portal:
  # Adresse der PWA (Ziel nach dem Einladungslink).
  public-url: ${PORTAL_PUBLIC_URL:http://localhost:4200}
  # Keycloak-Admin-API für Einladungen (ADR 0009). Secret in Produktion nur per Umgebungsvariable.
  keycloak:
    url: ${PORTAL_KEYCLOAK_URL:http://localhost:8081}
    realm: judo
    client-id: judo-portal-backend
    client-secret: ${PORTAL_KEYCLOAK_CLIENT_SECRET:dev-backend-secret}

name: Live-Check

# Täglicher Smoke-Test der Produktivseite. Aktiv, sobald die Repository-Variable LIVE_URL gesetzt ist
# (Settings → Secrets and variables → Actions → Variables, z. B. https://judo.tlandsberger.de).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Portal erreichbar
    if: vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Healthcheck, Anmeldeseite und Sicherheits-Header
        env:
          URL: ${{ vars.LIVE_URL }}
        run: |
          curl -fsS --retry 3 --retry-delay 20 "$URL/healthz"
          curl -fsS -o /dev/null "$URL/anmeldung/login/"
          curl -fsSI "$URL/anmeldung/login/" | grep -qi "content-security-policy"

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, Tests & Lint (inkl. API-Vertrag api/openapi.json)
        run: ./gradlew build --stacktrace

  infra:
    name: Dev-Infrastruktur (Postgres + Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Container starten
        run: docker compose -f infra/compose.dev.yaml up -d --wait --wait-timeout 300

      - name: Smoke-Test
        run: infra/scripts/smoke-test.sh
        env:
          CONTAINER_TOOL: docker

      - name: Container-Logs
        if: failure()
        run: docker compose -f infra/compose.dev.yaml logs

      - name: Aufräumen
        if: always()
        run: docker compose -f infra/compose.dev.yaml down -v

  frontend:
    name: Frontend (Lint, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: API-Typen aktuell? (aus api/openapi.json)
        run: |
          npm run generate:api
          git diff --exit-code -- src/app/api/schema.d.ts

      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    name: E2E (PWA + Backend + Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Infrastruktur starten
        run: docker compose -f infra/compose.dev.yaml up -d --wait --wait-timeout 300

      - name: Backend bauen und starten
        run: |
          ./gradlew :backend:bootJar
          nohup java -jar backend/build/libs/backend.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat backend.log; exit 1

      - name: Playwright installieren
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E-Tests
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Logs
        if: failure()
        run: |
          cat backend.log || true
          docker compose -f infra/compose.dev.yaml logs keycloak

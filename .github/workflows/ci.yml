name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Backend, Android, Web)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, Tests & Lint
        run: ./gradlew build --stacktrace

      - name: Web-Bundle bauen
        run: ./gradlew :client:composeApp:wasmJsBrowserDistribution

      - uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: client/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: web-app
          path: client/composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error

  ios:
    name: iOS-Framework kompilieren
    # macOS-Minuten zählen in privaten Repos 10-fach, daher nur manuell.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: iOS-Framework (Simulator) linken
        run: ./gradlew :client:composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble

jobs:
  checks:
    name: Prüfungen und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Commit-Nachrichten (Conventional Commits)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python scripts/check_commits.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            uv run python scripts/check_commits.py "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typprüfung
        run: uv run mypy portal
        env:
          PORTAL_SECRET_KEY: ci

      - name: Migrationen vollständig
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          PORTAL_SECRET_KEY: ci

      - name: Tests
        run: uv run pytest

  image:
    name: Image, Smoke-Test und E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: judo-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starten
        run: |
          mkdir -p /tmp/portal-data && chmod 777 /tmp/portal-data
          docker run -d --name portal -p 8000:8000 -v /tmp/portal-data:/data \
            -e PORTAL_SECRET_KEY=ci -e PORTAL_BASE_URL=http://localhost:8000 -e PORTAL_SECURE_COOKIES=false \
            -e PORTAL_WEBAUTHN_ALLOW_INSECURE_ORIGIN=true -e PORTAL_EMAIL_FILE_PATH=/data/mails \
            -e PORTAL_INITIAL_ADMIN_EMAIL=admin@test.local judo-portal:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' portal)" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs portal; exit 1

      - name: Smoke-Test
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS -o /dev/null http://localhost:8000/anmeldung/login/
          curl -fsSI http://localhost:8000/anmeldung/login/ | grep -i "content-security-policy"

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: npm

      - run: npm ci

      - name: E2E-Tests (Playwright-Container, gleiche Screenshots wie lokal)
        run: |
          docker run --rm --network host -v "$PWD":/work -v /tmp/portal-data/mails:/mails -w /work \
            -e MAIL_DIR=/mails -e CI=true "$PLAYWRIGHT_IMAGE" npx playwright test

      - name: Container-Logs
        if: failure()
        run: docker logs portal

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

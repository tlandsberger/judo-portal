name: Release

# Jeden Sonntag um 23:00 Uhr (Berliner Zeit): Gibt es seit dem letzten Release neue Commits auf main, wird aus den
# Conventional Commits die nächste Version ermittelt, getaggt, als GitHub-Release mit Changelog veröffentlicht und das
# Image nach GHCR gepusht. Renovate aktualisiert danach die Homecloud. Manuell startbar über „Run workflow“.
on:
  schedule:
    # GitHub plant in UTC: 21:00 UTC (Sommerzeit) und 22:00 UTC (Winterzeit); der Job prüft, welcher 23 Uhr ist.
    - cron: "0 21 * * 0"
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Neue Version nötig?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Uhrzeit prüfen (nur geplante Läufe)
        id: time
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Berlin date +%H)" != "23" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.time.outputs.skip != 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.time.outputs.skip != 'true'

      - name: Version ermitteln
        id: version
        if: steps.time.outputs.skip != 'true'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ] && [ -z "$(git log --oneline "$last"..HEAD)" ]; then
            echo "Keine neuen Commits seit $last – kein Release."
            exit 0
          fi
          next=$(uv run --frozen git-cliff --bumped-version)
          echo "Nächste Version: $next (letzte: ${last:-keine})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/ci.yml

  release:
    name: Taggen, Release und Image
    needs: [plan, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/judo-portal
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Changelog erzeugen
        run: uv run --frozen git-cliff --unreleased --tag "$VERSION" --strip header > RELEASE_NOTES.md

      - name: Tag und GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md --verify-tag

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags für das Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
